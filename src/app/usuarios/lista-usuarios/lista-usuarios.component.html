<div class="lista-container">
  <h2>Lista de Usuarios</h2>
  <ul>
    <li *ngFor="let usuario of usuarios" (click)="seleccionarUsuario(usuario)">
      {{ usuario.nombre }}
    </li>
  </ul>

  <!-- Muestra el detalle del usuario seleccionado -->
  <app-detalle-usuario [usuario]="usuarioSeleccionado"></app-detalle-usuario>
</div>
